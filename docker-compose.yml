services:
  postgres:
    image: postgres:17
    container_name: acm-db
    restart: unless-stopped
    command: postgres -c timezone=Europe/Berlin
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin}
      POSTGRES_DB: ${POSTGRES_DB:-mydb}
      TZ: Europe/Berlin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./DB/createTables.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-mydb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: acm-backend:latest
    build:
      context: ./Backend/API
      dockerfile: Dockerfile
    container_name: acm-backend
    restart: unless-stopped
    network_mode: host
    environment:
      DATABASE_URL: postgres://admin:admin@localhost:5432/mydb
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: acm-frontend:latest
    build:
      context: ./Frontend/ACM_Frontend
      dockerfile: Dockerfile
    container_name: acm-frontend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:80"
    depends_on: []

volumes:
  pgdata:
