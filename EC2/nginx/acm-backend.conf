# ─── Nginx Reverse-Proxy für ACM (Frontend + Backend) ───
# Bietet same-origin Zugriff: S3 Frontend + localhost:3000 Backend
# Kein CORS nötig – alles läuft über EC2-Public-IP:80
server {
    listen 80;
    server_name _;

    # ─── Frontend: Reverse-Proxy zu S3 Static Website ───
    location / {
        proxy_pass http://acm-fe-bucket.s3-website-eu-west-1.amazonaws.com;
        proxy_set_header Host acm-fe-bucket.s3-website-eu-west-1.amazonaws.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
    }

    # ─── Backend: Reverse-Proxy zu Rust/Axum (localhost:3000) ───
    location /acm/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
